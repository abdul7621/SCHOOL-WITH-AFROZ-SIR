# ==============================================================================
# 7A School ERP — Multi-Tenant SaaS Nginx Production Configuration
# Supports: school.7adigitalsolution.com, *.7adigitalsolution.com, and VPS IP
# ==============================================================================

upstream erp_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Main HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.7adigitalsolution.com 7adigitalsolution.com *.7adigitalsolution.com;

    # SSL Certificates (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/school.7adigitalsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.7adigitalsolution.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Client upload limits (50MB for bulk Excel/documents)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA Build Path
    root /var/www/school-erp/frontend/dist;
    index index.html;

    # API Proxy -> FastAPI Backend (Port 8000)
    location /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://erp_backend/health;
        proxy_set_header Host $host;
    }

    # Static Storage
    location /storage/ {
        alias /var/www/school-erp/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend SPA routing (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. HTTP Server Block (Port 80) -> Redirect to HTTPS / Serve ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name school.7adigitalsolution.com 7adigitalsolution.com *.7adigitalsolution.com 187.127.176.21 _;

    # Client upload limits
    client_max_body_size 50M;

    # Root for Frontend SPA Build (for Direct IP access)
    root /var/www/school-erp/frontend/dist;
    index index.html;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect Domain requests to HTTPS
    location / {
        if ($host ~* ^(school\.)?7adigitalsolution\.com$) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    # Direct IP API Proxy
    location /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://erp_backend/health;
        proxy_set_header Host $host;
    }
}
