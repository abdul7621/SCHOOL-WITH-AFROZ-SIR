# ==============================================================================
# 7A School ERP — Multi-Tenant SaaS Nginx Production Configuration
# Supports: school.7adigitalsolution.com, *.7adigitalsolution.com, and VPS IP
# ==============================================================================

upstream erp_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Main HTTP Gateway (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name school.7adigitalsolution.com 7adigitalsolution.com *.7adigitalsolution.com 187.127.176.21 _;

    # Client upload limits (50MB for bulk Excel/documents)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA Build Path
    root /var/www/school-erp/frontend/dist;
    index index.html;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Proxy -> FastAPI Backend (Port 8000)
    location /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://erp_backend/health;
        proxy_set_header Host $host;
    }

    # Static Storage
    location /storage/ {
        alias /var/www/school-erp/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend SPA routing (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
