# ==============================================================================
# 7A School ERP — Multi-Tenant SaaS Nginx Production Configuration
# Supports Wildcard Subdomains (*.7aedu.com) and Custom Domains (e.g. ume-school.com)
# ==============================================================================

# Upstream Backend Gunicorn/Uvicorn Cluster
upstream erp_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect for All Domains
server {
    listen 80;
    listen [::]:80;
    server_name 7aedu.com *.7aedu.com ume-school.com mmms-school.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Multi-Tenant Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 7aedu.com *.7aedu.com ume-school.com mmms-school.com;

    # SSL Certificates (Managed by CloudPanel / Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/7aedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/7aedu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max Upload Size for Excel & Document uploads (50MB)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root for Frontend SPA Build
    root /var/www/7a-school-erp/frontend/dist;
    index index.html;

    # API Proxy -> FastAPI Backend
    location /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health Check
    location /health {
        proxy_pass http://erp_backend/health;
        proxy_set_header Host $host;
    }

    # Static Uploads / Tenant Storage
    location /storage/ {
        alias /var/www/7a-school-erp/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend SPA Router Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
